<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Zambrana - Iniciar Sesion</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="../frontend/public/logo-icon-64.webp">
</head>
<body>
  <div class="login-container">
    <!-- Header con branding -->
    <header class="login-header">
      <img
        src="../frontend/public/logo_origin.png"
        alt="Zambrana Logo"
        class="login-logo"
        onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23fff%22 width=%22100%22 height=%22100%22 rx=%2210%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23ff6b35%22>Z</text></svg>'"
      >
      <p class="login-brand-text">Materiales de Construccion</p>
    </header>

    <!-- Formulario de login -->
    <main class="login-form-container slide-up">
      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Inicia sesion para continuar</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Correo electronico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="ejemplo@zambrana.com"
            autocomplete="email"
            required
          >
          <p id="emailError" class="form-error hidden"></p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Contrasena</label>
          <div class="password-container">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Ingresa tu contrasena"
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p id="passwordError" class="form-error hidden"></p>
        </div>

        <!-- Recordar sesion -->
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="remember" name="remember" style="width: 18px; height: 18px; accent-color: var(--coral-500);">
          <label for="remember" style="font-size: 0.875rem; color: var(--cemento-600); cursor: pointer;">
            Recordar sesion
          </label>
        </div>

        <!-- Submit button -->
        <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 0.5rem;">
          <span id="btnText">Iniciar Sesion</span>
          <span id="btnSpinner" class="spinner hidden"></span>
        </button>
      </form>

      <!-- Footer -->
      <footer class="login-footer">
        <p class="login-footer-text">
          ¿Olvidaste tu contrasena?
          <a href="#" class="login-footer-link">Recuperar</a>
        </p>
      </footer>
    </main>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    // Handle login form submission
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');

      // Reset errors
      emailError.classList.add('hidden');
      passwordError.classList.add('hidden');

      // Basic validation
      let isValid = true;

      if (!email || !email.includes('@')) {
        emailError.textContent = 'Por favor ingresa un correo valido';
        emailError.classList.remove('hidden');
        isValid = false;
      }

      if (!password || password.length < 6) {
        passwordError.textContent = 'La contrasena debe tener al menos 6 caracteres';
        passwordError.classList.remove('hidden');
        isValid = false;
      }

      if (!isValid) return;

      // Show loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Iniciando...';
      btnSpinner.classList.remove('hidden');

      // Simulate API call
      setTimeout(() => {
        // Success - redirect to map view
        window.location.href = 'mapa.html';
      }, 1500);
    }

    // Add input focus effects
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.classList.add('focused');
      });
      input.addEventListener('blur', function() {
        this.parentElement.classList.remove('focused');
      });
    });
  </script>
</body>
</html>
